<!-- OR -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        figure {
            width: 100%;
            height: 100vh;
            padding: 20px;
            display: grid;
            place-content: center;
        }
        img {
            width: 100%;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.9));
        }
        img.loading {
            opacity: 0;
            transform: translateY(45px);
            transition: transform 0.6s, opacity 0.9s;
        }
        img.loaded {
            opacity: 1;
            transform: translateY(0);
            transition-delay: 0s;
        }
    </style>
    <title>Intersection Observer</title>
</head>
<body>
    <figure>
        <img src="https://picsum.photos/500/500?random=1" alt="">
    </figure>
        <figure>
        <img src="https://picsum.photos/500/500?random=2" alt="">
    </figure>
        <figure>
        <img src="https://picsum.photos/500/500?random=3" alt="">
    </figure>
        <figure>
        <img src="https://picsum.photos/500/500?random=4" alt="">
    </figure>
        <figure>
        <img src="https://picsum.photos/500/500?random=5" alt="">
    </figure>
        <figure>
        <img src="https://picsum.photos/500/500?random=6" alt="">
    </figure>
        <figure>
        <img src="https://picsum.photos/500/500?random=7" alt="">
    </figure>
        <figure>
        <img src="https://picsum.photos/500/500?random=8" alt="">
    </figure>

    <script>
        const allImgs = document.querySelectorAll('img');
        allImgs.forEach(img => img.classList.add('loading'));

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('loaded');
                } else {
                    entry.target.classList.remove('loaded');
                }
            })
        }, {
            threshold: 0.3, // visibility of target element, value ranges between 0 to 1, 0 is default
            // rootMargin: '', // same as normal css margin and we can pass just like shorthand margin values. this is used for clipping viewport
        });

        allImgs.forEach(img => observer.observe(img));

    </script>
</body>
</html>
